<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Everywhere Speedcubing</title>
    <link rel="stylesheet" href="layout.css" />
    <link rel="stylesheet" href="design.css" />
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "name": "Everywhere Speedcubing",
        "url": "https://everywherespeedcubing.github.io/"
      }
    </script>
  </head>

  <body>
    <!-- Everywhere Speedcubing Header 1. -->
    <div class="header1">
      <h1 class="headers">Everywhere Speedcubing</h1>
    </div>
    <!-- Everywhere Speedcubing Header 1. -->

    <!-- Everywhere Speedcubing Scramble. -->
    <div class="scramble">
      <p id="scramble"></p>
      <button id="scramblebutton">New Scramble</button>
    </div>
    <!-- Everywhere Speedcubing Scramble. -->

    <!-- Everywhere Speedcubing Timer. -->
    <div class="timer">
      <p id="timer">0.00</p>
      <button id="timerbutton">Start</button>
    </div>
    <!-- Everywhere Speedcubing Timer. -->

    <!-- Everywhere Speedcubing Session. -->
    <div class="session">
      <p class="statName">Solves</p>
      <p id="solveTime"></p>
      <p class="statName">Best</p>
      <p id="bestTime"></p>
      <p class="statName">Mean</p>
      <p id="meanTime"></p>
      <p class="statName">Ao5</p>
      <p id="Ao5Time"></p>
      <p class="statName">Ao12</p>
      <p id="Ao12Time"></p>
      <p class="statName">Ao50</p>
      <p id="Ao50Time"></p>
      <p class="statName">Ao100</p>
      <p id="Ao100Time"></p>
    </div>
    <!-- Everywhere Speedcubing Session. -->

    <!-- Everywhere Speedcubing JavaScript file. -->
    <script src="timer.js"></script>
    <script src="scramble.js"></script>
    <script src="session.js"></script>
    <!-- Everywhere Speedcubing JavaScript file. -->
  </body>
</html>
